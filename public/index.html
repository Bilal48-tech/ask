<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Askwise</title>
<meta name="description" content="Askwise — ask anything about science, code, travel, homework and daily life.">
<meta name="theme-color" content="#6d5efc" id="tc">
<meta property="og:type" content="website">
<meta property="og:title" content="Askwise">
<meta property="og:description" content="A fast, private AI chat that runs in your browser.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="logo.svg">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="sk" href="#q">Skip to chat</a>

<div class="shell">
  <aside id="drawer" aria-label="Chat list">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 96 96" role="img" aria-label="Askwise logo">
        <rect width="96" height="96" rx="26" fill="#4338CA"/>
        <rect x="20" y="22" width="56" height="42" rx="14" fill="#fff"/>
        <path d="M30 60 L27 77 L46 63 Z" fill="#fff"/>
        <path d="M48 30 C49 38 53 42 62 43 C53 44 49 48 48 56 C47 48 43 44 34 43 C43 42 47 38 48 30 Z" fill="#4338CA"/>
      </svg>
      <span style="font-family:'Sora',sans-serif;font-weight:700">Ask<span style="color:#4338CA">wise</span></span>
    </div>

    <button class="new" id="new" type="button">+ New chat</button>
    <input id="srch" type="search" placeholder="Search chats…" aria-label="Search chats and messages" autocomplete="off">
    <div id="list" role="list"></div>

    <div class="sidefoot">
      <button class="sf" id="clr" type="button">Clear all</button>
      <button class="sf signup-trigger" id="signup-open" type="button">Sign up</button>
    </div>
  </aside>

  <main id="main" aria-label="Askwise chat">
    <header>
      <button class="ib" id="menu" type="button" aria-label="Open chat list" aria-expanded="false" aria-controls="drawer">☰</button>
      <h1 id="ttl">New chat</h1>
      <button class="ib" id="exp" type="button" aria-label="Export this chat" title="Export chat" hidden>⤓</button>
      <button class="ib" id="thm" type="button" aria-label="Change theme" title="Theme">◐</button>
    </header>

    <div id="chat">
      <div class="col" id="col"></div>
      <div class="dnw">
        <button id="dn" type="button" aria-label="Scroll to latest">↓</button>
      </div>
    </div>

    <footer>
      <div class="modes" id="modes" role="group" aria-label="Answer style"></div>
      <form class="comp" id="f">
        <textarea id="q" rows="1" maxlength="4000" placeholder="Ask me anything…" aria-label="Your question" aria-describedby="cnt"></textarea>

        <button class="ib mic" id="mic" type="button" hidden aria-label="Voice input" title="Voice input">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="2" width="6" height="12" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/>
          </svg>
        </button>

        <button id="go" type="submit" aria-label="Send" title="Send">➤</button>
      </form>
      <p class="note">AI can make mistakes. Check important information.<span id="cnt" class="cnt" hidden></span></p>
    </footer>
  </main>
</div>

<dialog id="signup-dialog" class="signup-dialog" aria-labelledby="signup-title">
  <form id="signup-form" class="signup-card">
    <div class="signup-heading">
      <div>
        <h2 id="signup-title">Create your account</h2>
        <p>Sign up to get started with Askwise.</p>
      </div>
      <button class="signup-close" id="signup-close" type="button" aria-label="Close sign-up form">×</button>
    </div>

    <label class="signup-label" for="signup-username">Username</label>
    <input class="signup-input" id="signup-username" name="username" type="text" autocomplete="username" minlength="3" maxlength="40" required>

    <label class="signup-label" for="signup-email">Email</label>
    <input class="signup-input" id="signup-email" name="email" type="email" autocomplete="email" required>

    <label class="signup-label" for="signup-password">Password</label>
    <div class="password-field">
      <input class="signup-input" id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <button class="password-toggle" type="button" data-password-target="signup-password" aria-label="Show password" aria-pressed="false" title="Show password">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <label class="signup-label" for="signup-confirm-password">Confirm password</label>
    <div class="password-field">
      <input class="signup-input" id="signup-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
      <button class="password-toggle" type="button" data-password-target="signup-confirm-password" aria-label="Show confirm password" aria-pressed="false" title="Show password">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <p class="signup-message" id="signup-message" role="status" aria-live="polite"></p>
    <button class="signup-submit" type="submit">Create account</button>
  </form>
</dialog>

<div id="ov" aria-hidden="true"></div>
<p id="status" class="sr" role="status" aria-live="polite"></p>
<div id="toast" role="status" aria-live="assertive" hidden>
  <span id="tm"></span>
  <button id="ta" type="button" hidden></button>
</div>

<script src="script.js"></script>
</body>
</html>
