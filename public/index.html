<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Askwise</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
 <aside>
  <div class="brand"><svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 96 96" role="img" aria-label="Askwise logo"><rect width="96" height="96" rx="26" fill="#4338CA"/><rect x="20" y="22" width="56" height="42" rx="14" fill="#fff"/><path d="M30 60 L27 77 L46 63 Z" fill="#fff"/><path d="M48 30 C49 38 53 42 62 43 C53 44 49 48 48 56 C47 48 43 44 34 43 C43 42 47 38 48 30 Z" fill="#4338CA"/></svg><span style="font-family:'Sora',sans-serif;font-weight:700">Ask<span style="color:#4338CA">wise</span></span></div>
  <button class="new" id="new" type="button">+ New chat</button>
  <input id="srch" type="search" placeholder="Search chats…" aria-label="Search chats">
  <div id="list"></div>
 </aside>
 <main>
  <header>
   <button class="ib" id="menu" type="button" aria-label="Chats">☰</button>
   <h1 id="ttl">New chat</h1>
   <button class="ib" id="exp" type="button" aria-label="Export chat" title="Export chat" hidden>⤓</button>
   <button class="ib" id="fs" type="button" aria-label="Text size" title="Text size">Aa</button>
   <button class="ib" id="thm" type="button" aria-label="Toggle theme" title="Toggle theme">◐</button>
  </header>
  <div id="chat"><div class="col" id="col"></div><div class="dnw"><button id="dn" type="button" aria-label="Scroll to bottom">↓</button></div></div>
  <footer>
   <div class="modes" id="modes"></div>
   <form class="comp" id="f">
    <textarea id="q" rows="1" maxlength="4000" placeholder="Ask me anything…" aria-label="Your question"></textarea>
    <button class="ib mic" id="vl" type="button" hidden title="Voice language">EN</button><button class="ib mic" id="mic" type="button" hidden aria-label="Voice input" title="Voice input"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg></button><button id="go" type="submit" aria-label="Send">➤</button>
   </form>
   <p class="note">AI can make mistakes. Check important information.</p>
  </footer>
 </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="ov"></div>
<script src="script.js"></script>
</body>
</html>
